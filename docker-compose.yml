services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: portal_fornecedores
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?defina PORTAL_DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
